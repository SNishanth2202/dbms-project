<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vehicle Registration System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
  <div class="container">
    <h1 class="text-center mb-4">🚗 Vehicle Registration System</h1>

    <!-- Navigation Buttons -->
    <div class="d-flex justify-content-center mb-4 gap-2">
      <button class="btn btn-primary" onclick="showSection('owners')">Owners</button>
      <button class="btn btn-success" onclick="showSection('vehicles')">Vehicles</button>
      <button class="btn btn-warning" onclick="showSection('registrations')">Registrations</button>
      <button class="btn btn-info" onclick="showSection('offices')">Offices</button>
    </div>

    <!-- Owners Section -->
    <div id="owners" class="card mb-4 section">
      <div class="card-header bg-primary text-white">Owners</div>
      <div class="card-body">
        <form id="ownerForm" class="row g-2 mb-3">
          <div class="col-md-3"><input class="form-control" id="owner_id" placeholder="Owner ID" required></div>
          <div class="col-md-3"><input class="form-control" id="owner_name" placeholder="Owner Name" required></div>
          <div class="col-md-3"><input class="form-control" id="address" placeholder="Address" required></div>
          <div class="col-md-3"><input class="form-control" id="phone" placeholder="Phone" required></div>
          <div class="col-md-3"><button class="btn btn-success w-100">Add Owner</button></div>
        </form>
        <table class="table table-bordered table-striped">
          <thead><tr><th>ID</th><th>Name</th><th>Address</th><th>Phone</th></tr></thead>
          <tbody id="ownersTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Vehicles Section -->
    <div id="vehicles" class="card mb-4 section d-none">
      <div class="card-header bg-success text-white">Vehicles</div>
      <div class="card-body">
        <form id="vehicleForm" class="row g-2 mb-3">
          <div class="col-md-2"><input class="form-control" id="owner_id" placeholder="Owner ID" required></div>
          <div class="col-md-2"><input class="form-control" id="vehicle_type" placeholder="Type" required></div>
          <div class="col-md-3"><input class="form-control" id="registration_number" placeholder="Reg. Number" required></div>
          <div class="col-md-3"><input class="form-control" id="model" placeholder="Model" required></div>
          <div class="col-md-2"><button class="btn btn-success w-100">Add Vehicle</button></div>
        </form>
        <table class="table table-bordered table-striped">
          <thead><tr><th>ID</th><th>Owner</th><th>Type</th><th>Reg. No.</th><th>Model</th></tr></thead>
          <tbody id="vehiclesTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Registrations Section -->
    <div id="registrations" class="card mb-4 section d-none">
      <div class="card-header bg-warning text-dark">Registrations</div>
      <div class="card-body">
        <form id="registrationForm" class="row g-2 mb-3">
          <div class="col-md-3"><input class="form-control" id="vehicle_id" placeholder="Vehicle ID" required></div>
          <div class="col-md-3"><input type="date" class="form-control" id="registration_date" required></div>
          <div class="col-md-3"><input type="date" class="form-control" id="expiry_date" required></div>
          <div class="col-md-3"><button class="btn btn-success w-100">Add Registration</button></div>
        </form>
        <table class="table table-bordered table-striped">
          <thead><tr><th>ID</th><th>Vehicle ID</th><th>Reg. Date</th><th>Expiry</th></tr></thead>
          <tbody id="registrationsTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Offices Section -->
    <div id="offices" class="card mb-4 section d-none">
      <div class="card-header bg-info text-white">Offices</div>
      <div class="card-body">
        <form id="officeForm" class="row g-2 mb-3">
          <div class="col-md-4"><input class="form-control" id="office_name" placeholder="Office Name" required></div>
          <div class="col-md-4"><input class="form-control" id="location" placeholder="Location" required></div>
          <div class="col-md-4"><button class="btn btn-success w-100">Add Office</button></div>
        </form>
        <table class="table table-bordered table-striped">
          <thead><tr><th>ID</th><th>Name</th><th>Location</th></tr></thead>
          <tbody id="officesTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:5000";

    // Show only one section at a time
    function showSection(id) {
      document.querySelectorAll(".section").forEach(sec => sec.classList.add("d-none"));
      document.getElementById(id).classList.remove("d-none");
      if (id === "owners") loadOwners();
      else if (id === "vehicles") loadVehicles();
      else if (id === "registrations") loadRegistrations();
      else if (id === "offices") loadOffices();
    }

    // Owners
    async function loadOwners() {
      const res = await fetch(`${API_URL}/owners`);
      const data = await res.json();
      document.getElementById("ownersTable").innerHTML = data.map(o =>
        `<tr><td>${o.owner_id}</td><td>${o.owner_name}</td><td>${o.address}</td><td>${o.phone}</td></tr>`
      ).join("");
    }
    document.getElementById("ownerForm").addEventListener("submit", async e => {
      e.preventDefault();
      const body = {
        owner_name: owner_name.value,
        address: address.value,
        phone: phone.value,
      };
      await fetch(`${API_URL}/owners`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      e.target.reset();
      loadOwners();
    });

    // Vehicles
    async function loadVehicles() {
      const res = await fetch(`${API_URL}/vehicles`);
      const data = await res.json();
      document.getElementById("vehiclesTable").innerHTML = data.map(v =>
        `<tr><td>${v.vehicle_id}</td><td>${v.owner_name || v.owner_id}</td><td>${v.vehicle_type}</td><td>${v.registration_number}</td><td>${v.model}</td></tr>`
      ).join("");
    }
    document.getElementById("vehicleForm").addEventListener("submit", async e => {
      e.preventDefault();
      const body = {
        owner_id: owner_id.value,
        vehicle_type: vehicle_type.value,
        registration_number: registration_number.value,
        model: model.value,
      };
      await fetch(`${API_URL}/vehicles`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      e.target.reset();
      loadVehicles();
    });

    // Registrations
    async function loadRegistrations() {
      const res = await fetch(`${API_URL}/registrations`);
      const data = await res.json();
      document.getElementById("registrationsTable").innerHTML = data.map(r =>
        `<tr><td>${r.registration_id}</td><td>${r.vehicle_id}</td><td>${r.registration_date}</td><td>${r.expiry_date}</td></tr>`
      ).join("");
    }
    document.getElementById("registrationForm").addEventListener("submit", async e => {
      e.preventDefault();
      const body = {
        vehicle_id: vehicle_id.value,
        registration_date: registration_date.value,
        expiry_date: expiry_date.value,
      };
      await fetch(`${API_URL}/registrations`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      e.target.reset();
      loadRegistrations();
    });

    // Offices
    async function loadOffices() {
      const res = await fetch(`${API_URL}/offices`);
      const data = await res.json();
      document.getElementById("officesTable").innerHTML = data.map(o =>
        `<tr><td>${o.office_id}</td><td>${o.office_name}</td><td>${o.location}</td></tr>`
      ).join("");
    }
    document.getElementById("officeForm").addEventListener("submit", async e => {
      e.preventDefault();
      const body = {
        office_name: office_name.value,
        location: location.value,
      };
      await fetch(`${API_URL}/offices`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      e.target.reset();
      loadOffices();
    });

    // Load owners by default
    loadOwners();
  </script>
</body>
</html>
